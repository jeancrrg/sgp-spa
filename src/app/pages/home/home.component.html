<toolbar-buttons></toolbar-buttons>
<div class="divisor"></div>
<menu-bar [listaMenuItens]="listaMenuItens"></menu-bar>

<div class="card sem-borda">
    <div class="col-12 p-0">
        <p-carousel [value]="listaProdutos" [numVisible]="1" [numScroll]="1" [circular]="true">
            <ng-template let-product pTemplate="item">
                <div class="col-12">
                    <img src="assets/layout/images/aneis.png" class="shadow-4" height="350px" width="100%"/>
                </div>
            </ng-template>
        </p-carousel>
    </div>

    <div class="col-12 p-0">
        <p-dataView [value]="listaProdutos" [paginator]="false" filterBy="name" [sortField]="sortField" [sortOrder]="sortOrder" layout="grid">
            <ng-template let-products pTemplate="gridItem">
                <div class="grid grid-nogutter">
                    <div class="col-12 md:col-4" *ngFor="let product of listaProdutos">
                        <div class="card m-3 border-1 surface-border card-produtos">
                            <div class="flex flex-column align-items-center text-center mb-3">
                                <img [src]="'assets/demo/images/product/' + product.image" [alt]="product.name" class="w-9 shadow-2 my-3 mx-0"/>

                                <div class="text-2xl font-bold">{{product.name}}</div>

                                <div class="mb-3">{{product.description}}</div>

                                <p-rating [ngModel]="product.rating" [readonly]="true" [cancel]="false"></p-rating>
                            </div>

                            <div class="flex align-items-center justify-content-between">
                                <span class="text-2xl font-semibold">${{product.price}}</span>
                                <p-button icon="pi pi-shopping-cart" [disabled]="product.inventoryStatus === 'OUTOFSTOCK'"></p-button>
                            </div>
                        </div>
                    </div>
                </div>
            </ng-template>
        </p-dataView>
    </div>
</div>
